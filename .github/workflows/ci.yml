name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Public placeholders only. Do not map GitHub secrets into this workflow.
# Real keys stay on Vercel. The env-check job fails if a secret name is set.
env:
  NEXT_TELEMETRY_DISABLED: "1"
  HUSKY: "0"
  NEXT_PUBLIC_SUPABASE_URL: https://ci.placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key-placeholder
  NEXT_PUBLIC_SITE_URL: https://ci.upsidelab.test

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 0

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test

  invariants:
    name: Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Green as of 2026-08-23. It was not, for months, because nothing ran
      # it: the suite drifted behind the portfolio rename, the design-token
      # pass and the dock rework until it reported 23 failures and stopped
      # meaning anything. Running it here is what keeps that from being
      # possible again. A failure is either a real regression or an
      # invariant that has outlived its rule, and both want a decision.
      - run: npm run test:invariants
      # The same argument, and `check:edges` had already proved it: it spent
      # the whole of the NO_VALUE change asserting that every formatter
      # degrades to an em dash, long after they degraded to "n/a". A check
      # nothing runs reports on the code it was written against, not the
      # code you have. Both of these take about a second.
      - run: npm run check:edges
      - run: npm run validate
      # The concurrency bench is the same kind of check and had the same
      # problem: it exists, it is documented as the way to test co-owner
      # races, and nothing ran it. Without Supabase credentials it skips the
      # live leg and runs the in-process sim, which is the part that catches
      # a lost update or a reverse lock order, takes about a second, and
      # needs no secrets. The live leg stays a local, deliberate run.
      - run: npm run bench:concurrency

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Production dependencies only, and only a high or critical advisory
      # stops a merge. A dev-only or moderate finding is worth reading and
      # is not worth blocking on, which is the difference between a check
      # people act on and one they learn to re-run until it passes. Clean as
      # of 2026-08-24: 0 vulnerabilities.
      - run: npm audit --omit=dev --audit-level=high

  sql:
    name: Migrations and row level security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without this the job starts psql before the server is listening and
        # fails on connection rather than on anything it was asked to check.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Reading a policy cannot tell you whether it holds. This builds the
      # schema from `shim.sql` plus all 75 migrations, in order, then asks
      # the database as the `authenticated` role with a real claim whether
      # one person can reach another's portfolio, holdings or conviction
      # notes. Section 15.3 of the audit asks for exactly this, and it was
      # answered by reading the migrations until now.
      - run: ./supabase/tests/run.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Validate public env (reject secrets)
        run: npx tsx scripts/check-ci-env.ts
      - run: npm run build
      - name: Install Chromium for landing smoke
        run: npx playwright install --with-deps chromium
      - name: Landing smoke
        run: npm run test:landing
